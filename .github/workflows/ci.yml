name: Validate atlas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npx playwright install --only-shell --with-deps chromium
      - run: npm run browser:e2e
      - run: npm run demo:verify
      - uses: actions/upload-artifact@v4
        with:
          name: production-atlas
          path: dist
